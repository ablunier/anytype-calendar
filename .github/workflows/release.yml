name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds every installer without releasing anything, and keeps them as workflow artifacts.
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches apps/desktop package.json version
        if: github.ref_type == 'tag'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$tag_version" != "$desktop_version" ]; then
            echo "Tag $GITHUB_REF_NAME (version $tag_version) does not match apps/desktop/package.json version $desktop_version" >&2
            exit 1
          fi

      # Forge creates the release when it finds none, so three OS jobs starting together would
      # create three. The releases list is used because the by-tag endpoint skips drafts, which
      # a re-run finds already there.
      - name: Create the draft release
        if: github.ref_type == 'tag'
        run: |
          existing="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")"
          if [ -z "$existing" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          cache: npm

      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      - name: Upload installers to the draft release
        if: github.ref_type == 'tag'
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Make installers
        if: github.ref_type != 'tag'
        run: npm run make

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: installers-${{ runner.os }}
          path: apps/desktop/dist/make/
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
